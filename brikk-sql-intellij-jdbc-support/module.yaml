product: jvm/lib

description: Optional generic JDBC introspector routing for IntelliJ database dialect plugins.

apply:
  - ../publish.module-template.yaml

dependencies:
  # Build-only: prepares/fingerprints the compile SDK. No support classes are bundled here.
  - ../brikk-sql-intellij-support: compile-only

settings:
  jvm:
    release: 21
  kotlin:
    version: 2.4.10
    freeCompilerArgs:
      - -classpath=build/intellij-sql-api/intellij-sql-api.jar:build/artifacts/CompiledJvmArtifact/brikk-sql-intellij-supportjvm/kotlin-output
      - -Xexplicit-api=strict
  publishing:
    artifactId: brikk-sql-intellij-jdbc-support
    version: 0.2.1-SNAPSHOT
