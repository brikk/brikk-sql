# DuckDB native-grammar verifiers over DuckDB's own parser: the harness oracle for corpus gates and
# ParseOnlyDuckdbVerifier for isolated editor parsing and ConnectionDuckdbVerifier for a caller's
# initialized instance and grammar profile. Neither editor verifier binds or runs the user's SQL.
product: jvm/lib

# TODO(review): used verbatim as the published POM <description> (required by Maven Central).
description: DuckDB native-grammar SQL verifiers (embedded DuckDB parser, parse-only editor variant) for brikk-sql.

apply:
  - ../publish.module-template.yaml

dependencies:
  - ../brikk-sql-verify-api: exported
  # Embedded DuckDB, pinned to engine 2.0.0 (jdbc artifact 2.0.0.0) to match the generated
  # DuckDB function catalog. Editors that pass the user's own driver exclude it.
  - org.duckdb:duckdb_jdbc:2.0.0.0

settings:
  publishing:
    # Published coordinate: dev.brikk.house:brikk-sql-verify-duckdb.
    artifactId: brikk-sql-verify-duckdb
  jvm:
    release: 21
  kotlin:
    version: 2.4.10
    serialization: json
    freeCompilerArgs:
      - -Xexplicit-api=strict
