product: jvm/lib

description: Test fixtures for IntelliJ database dialect plugins built on Brikk SQL IntelliJ support.

apply:
  - ../publish.module-template.yaml

dependencies:
  - ../brikk-sql-intellij-support

settings:
  jvm:
    release: 21
  kotlin:
    version: 2.4.10
    # This classpath replaces the toolchain's, so it repeats the module dependencies' outputs.
    freeCompilerArgs:
      - -classpath=build/intellij-sql-api/intellij-sql-api.jar:build/artifacts/CompiledJvmArtifact/brikk-sql-intellij-supportjvm/kotlin-output:build/artifacts/CompiledJvmArtifact/brikk-sqljvm/kotlin-output:build/artifacts/CompiledJvmArtifact/brikk-sql-metadatajvm/kotlin-output
      - -Xexplicit-api=strict
  publishing:
    artifactId: brikk-sql-intellij-test-support
    version: 0.2.0-SNAPSHOT
