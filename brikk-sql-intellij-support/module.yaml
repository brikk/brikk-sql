product: jvm/lib

description: Cooperative SQL execution, PIPE and editor support for IntelliJ database dialect plugins.

apply:
  - ../publish.module-template.yaml

dependencies:
  # exported: the PIPE API exposes core types (statement ranges, lowering results).
  - ../brikk-sql: exported
  - ../brikk-sql-metadata

plugins:
  brikk-sql-intellij-tooling: enabled

settings:
  jvm:
    release: 21
  kotlin:
    version: 2.4.10
    freeCompilerArgs:
      - -classpath=build/intellij-sql-api/intellij-sql-api.jar
      - -Xexplicit-api=strict
  publishing:
    artifactId: brikk-sql-intellij-support
    version: 0.2.0-SNAPSHOT
