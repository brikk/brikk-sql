name: Publish SQL IntelliJ support

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SQL IntelliJ support release version'
        required: true
      core_version:
        description: 'Formal core/metadata/verify-api version used by support'
        required: false
        default: ''
      publish_core:
        description: 'Publish NEW core prerequisites too; false for a support-only patch against released core'
        type: boolean
        required: false
        default: false
      preverified:
        description: 'Source already verified: skip the full test gate, keep the release checks'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: publish-intellij-support
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !inputs.preverified }}
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    # A skipped gate counts only for a preverified run; a failed or cancelled one never does.
    if: ${{ !cancelled() && (needs.test.result == 'success' || (inputs.preverified && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare snapshot-repository model credentials
        run: |
          umask 077
          printf 'brikk.mavencentral.user=unused\nbrikk.mavencentral.pass=unused\n' > .env
      - name: Install the formal release locally and check it
        env:
          SUPPORT_VERSION: ${{ inputs.version }}
          CORE_VERSION: ${{ inputs.core_version }}
          PUBLISH_CORE: ${{ inputs.publish_core }}
        run: |
          python3 -m unittest discover -s tools -p 'test_*release*.py'
          if [ -z "$CORE_VERSION" ]; then
            echo "::error::A Central release of support needs core_version (support takes released core, metadata and verify-api)"
            exit 1
          fi
          args=("$SUPPORT_VERSION" --core-version "$CORE_VERSION")
          artifacts=brikk-sql-intellij-support,brikk-sql-intellij-jdbc-support,brikk-sql-intellij-test-support
          if [ "$PUBLISH_CORE" = true ]; then
            artifacts="brikk-sql,brikk-sql-jvm,brikk-sql-metadata,brikk-sql-metadata-jvm,brikk-sql-verify-api,$artifacts"
          else
            args+=(--skip-core-publication)
          fi
          python3 tools/publish_intellij_support.py "${args[@]}" --local
          python3 tools/verify_release_candidates.py "$CORE_VERSION" --support-version "$SUPPORT_VERSION" \
            --only "$artifacts"
          python3 tools/verify_intellij_publication.py "$SUPPORT_VERSION" --core-version "$CORE_VERSION"

      - name: Publish SQL IntelliJ support and explicitly requested new core prerequisites
        env:
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.KOTLIN_TOOLCHAIN_MAVENCENTRAL_USERNAME || secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.KOTLIN_TOOLCHAIN_MAVENCENTRAL_PASSWORD || secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE || secrets.KOTLIN_TOOLCHAIN_SIGNING_PASSPHRASE }}
          SUPPORT_VERSION: ${{ inputs.version }}
          CORE_VERSION: ${{ inputs.core_version }}
          PUBLISH_CORE: ${{ inputs.publish_core }}
        run: |
          args=("$SUPPORT_VERSION")
          if [ -n "$CORE_VERSION" ]; then
            args+=(--core-version "$CORE_VERSION")
          fi
          if [ "$PUBLISH_CORE" != true ]; then
            args+=(--skip-core-publication)
          fi
          python3 tools/publish_intellij_support.py "${args[@]}"
