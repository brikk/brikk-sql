product: jvm/lib

description: Cooperative SQL execution, PIPE and editor support for IntelliJ database dialect plugins.

apply:
  - ../publish.module-template.yaml

dependencies:
  # exported: the PIPE API exposes core types (statement ranges, lowering results).
  - ../brikk-sql: exported
  # exported: the completion API exposes metadata types (snapshots, function presentations).
  - ../brikk-sql-metadata: exported
  # exported: native validators answer with the verification API's results and error positions.
  - ../brikk-sql-verify-api: exported

plugins:
  brikk-sql-intellij-tooling: enabled

settings:
  jvm:
    release: 21
  kotlin:
    version: 2.4.10
    # This classpath replaces the toolchain's, so it repeats the module dependencies' outputs.
    freeCompilerArgs:
      - -classpath=build/intellij-sql-api/intellij-sql-api.jar:build/artifacts/CompiledJvmArtifact/brikk-sqljvm/kotlin-output:build/artifacts/CompiledJvmArtifact/brikk-sql-metadatajvm/kotlin-output:build/artifacts/CompiledJvmArtifact/brikk-sql-verify-apijvm/kotlin-output
      - -Xexplicit-api=strict
  publishing:
    artifactId: brikk-sql-intellij-support
    version: 0.2.3-SNAPSHOT
