# Aggregate of every native-grammar verifier (Trino, DuckDB, Doris; ShardingSphere advisory) plus
# the SqlVerifiers registry. Depend on a single brikk-sql-verify-<engine> artifact to pull one engine.
# Its tests are brikk-sql's verification gates.
product: jvm/lib

# TODO(review): used verbatim as the published POM <description> (required by Maven Central).
description: SQL verification oracles (Trino, DuckDB, Doris fidelity; ShardingSphere advisory) for brikk-sql.

apply:
  - ../publish.module-template.yaml

dependencies:
  - ../brikk-sql-verify-api: exported
  - ../brikk-sql-verify-trino: exported
  - ../brikk-sql-verify-duckdb: exported
  - ../brikk-sql-verify-doris: exported
  - ../brikk-sql-verify-shardingsphere: exported

test-dependencies:
  # The verify gate re-generates every corpus SQL through brikk's own parser+generator:
  # the corpora's "generated" strings are the Python oracle's outputs, and ours diverge
  # from them exactly at the registered brikk extensions (docs/brikk-extensions.md), so
  # the gate must feed the engines what WE actually emit.
  - ../brikk-sql

settings:
  publishing:
    # Explicit artifactId is required by Maven Central publishing; equals the
    # default (module name). Published coordinate: dev.brikk.house:brikk-sql-verify.
    artifactId: brikk-sql-verify
  jvm:
    # trino-parser needs a JDK 25 runtime; this module's own classes stay Java 21 bytecode.
    jdk:
      version: 25
    release: 21
    test:
      systemProperties:
        # The tests run from this module's directory.
        brikk.doris.parser.jar: ../vendor/lib/doris-fe-sql-parser-4.1.5-g917b20be8387.jar
  kotlin:
    version: 2.4.10
  internal:
    # excludeDependencies does not propagate through module dependencies, so the ShardingSphere
    # Groovy exclusion is repeated here (see brikk-sql-verify-shardingsphere).
    excludeDependencies:
      - org.apache.groovy:groovy

test-settings:
  kotlin:
    # Only the gate tests read JSON; the published aggregate carries no serialization dependency.
    serialization: json
