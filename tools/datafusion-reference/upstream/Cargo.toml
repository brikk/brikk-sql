[package]
name = "brikk-datafusion-reference"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "brikk-datafusion-reference"
path = "../src/main.rs"

[features]
spice = []

[dependencies]
datafusion = { version = "=55.2.0", default-features = false, features = ["sql", "nested_expressions", "datetime_expressions", "regex_expressions", "string_expressions", "unicode_expressions", "encoding_expressions", "crypto_expressions"] }
datafusion-sql = "=55.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
