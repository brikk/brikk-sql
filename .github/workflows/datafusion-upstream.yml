name: DataFusion and Spice upgrade checks

# Functional gates and explicitly requested native qualification. Weekly checks are deferred.
on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to qualify with its pinned native reference
        required: true
        type: choice
        options: [datafusion, spice]
      candidate_profile:
        description: Optional reviewed profile JSON path in this checkout (otherwise current pins)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  tracking-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Offline functional contracts
        run: python3 -m unittest discover -s tools -p 'test_*datafusion*.py'
      - name: Demonstrate additions, removals, signatures and regressions
        run: |
          python3 tools/datafusion_upstream.py demo --output build/upstream-demo
          python3 tools/datafusion_upstream.py compare build/upstream-demo/before build/upstream-demo/after --output build/upstream-demo/repeated-report.json
          cmp build/upstream-demo/report.json build/upstream-demo/repeated-report.json
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controlled-upgrade-report
          path: build/upstream-demo
          retention-days: 14

  native-candidate:
    if: github.event_name == 'workflow_dispatch'
    needs: tracking-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRODUCT: ${{ inputs.product }}
      CANDIDATE_PROFILE: ${{ inputs.candidate_profile }}
      GITHUB_TOKEN: ${{ github.token }}
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the reference toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/upstream-reference
          key: native-reference-${{ runner.os }}-${{ inputs.product }}-${{ hashFiles('tools/datafusion-reference/**/Cargo.lock', 'tools/datafusion-reference/**/Cargo.toml') }}
      - name: Create local-only Kotlin build credentials
        run: |
          umask 077
          printf 'brikk.mavencentral.user=ci-placeholder\nbrikk.mavencentral.pass=ci-placeholder\n' > .env
      - name: Build the reviewed reference and capture fresh evidence
        run: |
          python3 tools/datafusion_upstream.py profile "$PRODUCT" --output build/default-profile.json
          python3 tools/run_datafusion_upgrade_ci.py
      - name: Confirm supported defaults were not changed
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-upgrade-evidence-${{ inputs.product }}
          path: build/upstream-candidate
          if-no-files-found: warn
          retention-days: 14
