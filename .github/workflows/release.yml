name: Release to Maven Central

# Push a branch named release/<version> (e.g. release/0.1.0) to publish that exact release
# version of all modules to Maven Central. The version is the branch-name suffix after
# "release/". Central validates and publishes the deployment bundles automatically.
#
# A manual run can select comma-separated modules to complete a partial release.
#
# The full test suite (test.yml) must be green first; a red gate blocks the release (EVAL-03).
# A manual run marked `preverified` (its source already verified by the targeted checks) skips that
# gate; it still installs the formal release locally and checks its POMs before anything reaches Central.

on:
  push:
    branches: [ 'release/**' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
      modules:
        description: 'Optional comma-separated SQL modules; empty releases all aligned SQL modules'
        required: false
        default: ''
      preverified:
        description: 'Source already verified: skip the full test gate, keep the release checks'
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.preverified }}
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    # A skipped gate counts only for a preverified manual run; a failed or cancelled one never does.
    if: ${{ !cancelled() && (needs.test.result == 'success' || (inputs.preverified && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine version
        id: ver
        # The dispatch input is passed through env rather than interpolated into the script,
        # so a crafted value cannot inject shell (GitHub's script-injection guidance).
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#release/}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "::error::Could not derive a version from ref '$GITHUB_REF_NAME'. Use a branch named release/<version> or the workflow_dispatch input."
            exit 1
          fi
          python3 tools/release_config.py validate "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      # The build config references .env as the credentials file for the centralSnapshots
      # repo, so the model won't load unless it exists with those keys.
      # (The mavenCentral release path itself authenticates via the KOTLIN_TOOLCHAIN_* env vars.)
      - name: Write .env credentials
        run: |
          umask 077
          cat > .env <<EOF
          brikk.mavencentral.user=${{ secrets.KOTLIN_TOOLCHAIN_MAVENCENTRAL_USERNAME || secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME }}
          brikk.mavencentral.pass=${{ secrets.KOTLIN_TOOLCHAIN_MAVENCENTRAL_PASSWORD || secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD }}
          EOF

      - name: Install the formal release locally and check it
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 -m unittest discover -s tools -p 'test_*release*.py'
          ./publish-release.sh --local "$RELEASE_VERSION"
          python3 tools/verify_release_candidates.py "$RELEASE_VERSION"
          python3 tools/verify_verifier_publication.py "$RELEASE_VERSION"

      - name: Publish release to Maven Central
        # The toolchain env-var name for Central creds differs by version: 0.11 reads the
        # NO-underscore names (KOTLIN_TOOLCHAIN_MAVENCENTRAL_*), newer reads the underscore
        # names. Export BOTH, each sourced from whichever secret exists, so it works regardless.
        env:
          KOTLIN_TOOLCHAIN_MAVENCENTRAL_USERNAME: ${{ secrets.KOTLIN_TOOLCHAIN_MAVENCENTRAL_USERNAME || secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVENCENTRAL_PASSWORD: ${{ secrets.KOTLIN_TOOLCHAIN_MAVENCENTRAL_PASSWORD || secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.KOTLIN_TOOLCHAIN_MAVENCENTRAL_USERNAME || secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.KOTLIN_TOOLCHAIN_MAVENCENTRAL_PASSWORD || secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE || secrets.KOTLIN_TOOLCHAIN_SIGNING_PASSPHRASE }}
          KOTLIN_TOOLCHAIN_SIGNING_PASSPHRASE: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE || secrets.KOTLIN_TOOLCHAIN_SIGNING_PASSPHRASE }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_MODULES: ${{ github.event.inputs.modules }}
        run: |
          modules=()
          if [ -n "$RELEASE_MODULES" ]; then
            IFS=',' read -r -a modules <<< "$RELEASE_MODULES"
          fi
          ./publish-release.sh "$RELEASE_VERSION" "${modules[@]}"
